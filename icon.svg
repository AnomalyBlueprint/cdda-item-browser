<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0f172a" rx="112" ry="112"/>
  
  <g transform="translate(156, 156) scale(1.2)">
    <!-- A pixelated green box -->
    <rect x="40" y="30" width="80" height="20" fill="#22c55e"/>
    <rect x="20" y="50" width="120" height="80" fill="#16a34a"/>
    <rect x="40" y="130" width="80" height="20" fill="#15803d"/>
    
    <!-- Magnifying glass pixelated -->
    <rect x="90" y="90" width="20" height="20" fill="#38bdf8"/>
    <rect x="80" y="80" width="40" height="10" fill="#0ea5e9"/>
    <rect x="80" y="110" width="40" height="10" fill="#0ea5e9"/>
    <rect x="70" y="90" width="10" height="20" fill="#0ea5e9"/>
    <rect x="120" y="90" width="10" height="20" fill="#0ea5e9"/>
    
    <!-- Handle -->
    <rect x="110" y="110" width="10" height="10" fill="#64748b"/>
    <rect x="120" y="120" width="20" height="20" fill="#475569"/>
    <rect x="130" y="130" width="20" height="20" fill="#334155"/>
  </g>
</svg>
